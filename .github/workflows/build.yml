# SPDX-License-Identifier: Apache-2.0
name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build, test and run examples
        shell: bash
        run: bash ./gradlew --no-daemon build :examples:run :examples:textPdf :examples:flowPdf :examples:tablePdf :examples:componentPdf :examples:advancedPdf
      - name: Install independent PDF verification tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 -m venv build/pdf-verification-venv
          build/pdf-verification-venv/bin/python -m pip install -r scripts/requirements-verification.txt
      - name: Verify PDF structures, editable forms and visual baseline
        if: runner.os == 'Linux'
        run: build/pdf-verification-venv/bin/python scripts/verify_advanced_pdf.py
