# SPDX-License-Identifier: Apache-2.0
name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            classifier: natives-linux
          - os: windows-latest
            classifier: natives-windows
          - os: macos-15-intel
            classifier: natives-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build, API compatibility, local distribution and examples
        shell: bash
        run: |
          python scripts/test_api_compatibility.py
          bash ./gradlew --no-daemon --console=plain -Pexport4jNativeClassifier=${{ matrix.classifier }} build apiCheck sbom publishLocalBundle :examples:run :examples:textPdf :examples:flowPdf :examples:tablePdf :examples:componentPdf :examples:advancedPdf
      - name: Consume only published coordinates and run native OpenType
        shell: bash
        run: bash ./gradlew --no-daemon --console=plain -p verification/consumer -Pexport4jNativeClassifier=${{ matrix.classifier }} build run openType resolvedLibraries --refresh-dependencies
      - name: Verify generation and conversion without printing services
        shell: bash
        run: python scripts/verify_driverless.py --consumer-build-directory verification/consumer/build --output-directory build/verification/driverless
      - name: Install independent PDF verification tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 -m venv build/pdf-verification-venv
          build/pdf-verification-venv/bin/python -m pip install -r scripts/requirements-verification.txt
      - name: Verify PDF structures, editable forms and visual baseline
        if: runner.os == 'Linux'
        run: build/pdf-verification-venv/bin/python scripts/verify_advanced_pdf.py
      - name: Retain platform verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            */build/test-results/test/*.xml
            build/reports/api/*.json
            build/reports/sbom.cdx.json
            verification/consumer/build/resolved-libraries.txt
            verification/consumer/build/resolved-components.txt
            verification/consumer/build/resolved-library-sha256.txt
            verification/consumer/build/output/**/*.pdf
            build/verification/driverless/report.json
            build/verification/driverless/*.log
            build/verification/driverless/*.denied
  signed-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify temporary signing, bundle, tamper rejection and coordinate consumer
        run: python scripts/verify_signed_distribution.py --version 0.0.0-verification --native-classifier natives-linux
      - name: Retain public verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-distribution-verification
          if-no-files-found: warn
          path: |
            build/verification/signed-distribution/distribution-report.json
            build/verification/signed-distribution/maven-central-bundle.zip
            build/verification/signed-distribution/verification-public-key.asc
            build/verification/signed-distribution/sbom.cdx.json
            build/verification/signed-distribution/build-inputs.json
